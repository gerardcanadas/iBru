name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iBru.xcodeproj \
            -scheme iBru

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project iBru.xcodeproj \
            -scheme iBru \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project iBru.xcodeproj \
            -scheme iBru \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | grep -E "error:|Test (Suite|Case|Passed|Failed)|BUILD (SUCCEEDED|FAILED)"
